<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aventador SVJ | Lamborghini</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Header (Giữ nguyên như trang chủ & đồng bộ trạng thái đăng nhập) -->
    <header class="navbar">
        <a href="index.html" class="logo">LAMBORGHINI</a>
        <nav>
            <a href="index.html">Models</a>
            <a href="cart.html">Cart (<span id="cart-count">0</span>)</a>
            <span id="user-nav">
                <a href="auth.html">ACCOUNT</a>
            </span>
        </nav>
    </header>

    <!-- Chi tiết sản phẩm -->
    <section class="detail-section">
        <div class="detail-image animate-fade">
            <img src="image/123.gif" alt="Aventador SVJ" style="width: 100%; max-width: 550px; object-fit: contain; display: block; margin: auto; filter: drop-shadow(0 15px 30px rgba(0,0,0,0.8));">
        </div>
        
        <div class="detail-info animate-slide-up">
            <h1 class="detail-title">AVENTADOR SVJ</h1>
            <p class="detail-price">$517,770</p>
            
            <div class="specs-grid">
                <div class="spec-item">
                    <span class="spec-label">ĐỘNG CƠ</span>
                    <span class="spec-value">V12, 6.5L</span>
                </div>
                <div class="spec-item">
                    <span class="spec-label">CÔNG SUẤT TỐI ĐA</span>
                    <span class="spec-value">770 CV</span>
                </div>
                <div class="spec-item">
                    <span class="spec-label">0-100 KM/H</span>
                    <span class="spec-value">2.8 s</span>
                </div>
                <div class="spec-item">
                    <span class="spec-label">TỐC ĐỘ TỐI ĐA</span>
                    <span class="spec-value">> 350 km/h</span>
                </div>
            </div>

            <!-- Gọi hàm addToCart với ID, Tên, Giá, Hình ảnh local -->
            <button class="btn-luxury btn-full" 
                onclick="addToCart('svj_01', 'Aventador SVJ', 517770, 'image/123.gif')">
                ĐƯA VÀO BỘ SƯU TẬP (GIỎ HÀNG)
            </button>
        </div>
    </section>

    <script src="https://unpkg.com/@studio-freight/lenis@1.0.34/dist/lenis.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="js/main.js"></script>

    <!-- Script tự động hiển thị tên tài khoản VIP & Đăng xuất -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const userNav = document.getElementById('user-nav');
            const currentUser = JSON.parse(localStorage.getItem('lambo_logged_in'));

            if (currentUser && currentUser.username) {
                userNav.innerHTML = `
                    <span style="color: #d4af37; margin-right: 12px; font-size: 13px; letter-spacing: 1px; font-weight: 600;">
                        VIP: ${currentUser.username.toUpperCase()}
                    </span>
                    <a href="#" style="color: #888; text-decoration: none; font-size: 12px; letter-spacing: 1px; transition: color 0.3s;" onmouseover="this.style.color='#fff'" onmouseout="this.style.color='#888'" onclick="handleLogout(event)">LOGOUT</a>
                `;
            }
        });

        function handleLogout(e) {
            e.preventDefault();
            if (confirm('Bạn có chắc chắn muốn đăng xuất khỏi tài khoản VIP?')) {
                localStorage.removeItem('lambo_logged_in');
                window.location.reload();
            }
        }
    </script>
</body>
</html>
