      <text x="50" y="59" font-size="9.5" font-weight="700" fill="#EF4444">⚡ INSTANT DISPATCH ALERT</text>
    </g>

    <!-- Node: SQLite WAL DB -->
    <g id="node-db" transform="translate(18, 308)">
