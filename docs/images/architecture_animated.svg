      <text x="25" y="39" text-anchor="middle" font-size="14">⚡</text>
      <text x="48" y="30" class="node-title">Local PTY Shell Bridge</text>
      <text x="48" y="48" class="node-sub">Isolated Node-PTY Socket</text>
