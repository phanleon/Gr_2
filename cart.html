<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Garage | Lamborghini</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="cart-page">

    <header class="navbar">
        <a href="index.html" class="logo">LAMBORGHINI</a>
        <nav>
            <a href="index.html">Models</a>
            <a href="cart.html" style="color:#d4af37">Cart (<span id="cart-count">0</span>)</a>
            <span id="user-nav">
                <a href="auth.html">ACCOUNT</a>
            </span>
        </nav>
    </header>

    <main class="cart-wrapper animate-slide-up">
        <h1 class="cart-title">YOUR GARAGE</h1>
        
        <!-- Danh sách xe sẽ được JS render vào đây -->
        <div id="cart-items-container"></div>
        
        <!-- Tổng tiền -->
        <div class="cart-summary" id="cart-summary" style="display: none;">
            <div class="total-line">
                <span>TỔNG CỘNG:</span>
                <span id="total-price">$0</span>
            </div>
            <button class="btn-luxury btn-full" onclick="openVipModal()">THANH TOÁN HỢP ĐỒNG VIP</button>
        </div>
    </main>

    <!-- MODAL HÓA ĐƠN / HỢP ĐỒNG BÀN GIAO XE VIP -->
    <div id="vip-modal" class="modal-overlay" style="display: none;">
        <div class="modal-card">
            <div class="modal-header">
                <span class="gold-badge">OFFICIAL VEHICLE ACQUISITION</span>
                <h2>HỢP ĐỒNG ĐẶT MUA SIÊU XE</h2>
                <p id="contract-code">CONTRACT #LMB-XXXX</p>
            </div>

            <div class="modal-body">
                <div class="info-row">
                    <span>CHỦ SỞ HỮU (VIP CLIENT):</span>
                    <strong id="modal-client-name">KHÁCH HÀNG VIP</strong>
                </div>
                <div class="info-row">
                    <span>NGÀY KÝ KẾT:</span>
                    <strong id="modal-date">13/09/2026</strong>
                </div>
                <div class="divider"></div>
                
                <div class="purchased-cars" id="modal-car-list">
                    <!-- Danh sách xe được render tại đây -->
                </div>

                <div class="divider"></div>
                <div class="info-row total-row">
                    <span>TỔNG GIÁ TRỊ HỢP ĐỒNG:</span>
                    <strong id="modal-total-price" style="color: #d4af37;">$0</strong>
                </div>
            </div>

            <div class="modal-footer">
                <button type="button" class="btn-cancel" onclick="closeVipModal()">HỦY BỎ</button>
                <button type="button" class="btn-confirm" onclick="confirmOrder()">XÁC NHẬN BÀN GIAO & LƯU GARAGE</button>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/@studio-freight/lenis@1.0.34/dist/lenis.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="js/main.js"></script>

    <!-- Script điều khiển Modal & Đồng bộ theo biến lamboCart của nhóm -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const userNav = document.getElementById('user-nav');
            const currentUser = JSON.parse(localStorage.getItem('lambo_logged_in'));

            if (currentUser && currentUser.username) {
                userNav.innerHTML = `
                    <span style="color: #d4af37; margin-left: 20px; font-size: 13px; letter-spacing: 1px; font-weight: 600;">
                        VIP: ${currentUser.username.toUpperCase()}
                    </span>
                    <a href="#" style="color: #888; text-decoration: none; font-size: 12px; margin-left: 12px; letter-spacing: 1px;" onmouseover="this.style.color='#fff'" onmouseout="this.style.color='#888'" onclick="handleLogout(event)">LOGOUT</a>
                `;
            }
        });

        function handleLogout(e) {
            e.preventDefault();
            if (confirm('Bạn có muốn đăng xuất khỏi tài khoản VIP?')) {
                localStorage.removeItem('lambo_logged_in');
                window.location.reload();
            }
        }

        let currentCartData = [];

        function openVipModal() {
            // Đọc trực tiếp từ key lamboCart của nhóm
            currentCartData = JSON.parse(localStorage.getItem('lamboCart')) || [];
            
            if (currentCartData.length === 0) {
                alert('Garage giỏ hàng của bạn đang trống! Hãy chọn siêu xe trước.');
                return;
            }

            const currentUser = JSON.parse(localStorage.getItem('lambo_logged_in'));
            if (!currentUser) {
                alert('Vui lòng đăng nhập tài khoản VIP để lập hợp đồng sở hữu xe!');
                window.location.href = 'auth.html';
                return;
            }

            const contractId = 'LMB-' + Math.floor(100000 + Math.random() * 900000);
            document.getElementById('contract-code').innerText = 'CONTRACT #' + contractId;
            document.getElementById('modal-client-name').innerText = currentUser.username.toUpperCase();
            document.getElementById('modal-date').innerText = new Date().toLocaleDateString('vi-VN');

            const carListContainer = document.getElementById('modal-car-list');
            carListContainer.innerHTML = '';
            let total = 0;

            currentCartData.forEach(item => {
                total += Number(item.price || 0);
                carListContainer.innerHTML += `
                    <div class="item" style="display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 8px;">
                        <span>✦ ${item.name}</span>
                        <strong style="color: #d4af37;">$${Number(item.price).toLocaleString()}</strong>
                    </div>
                `;
            });

            document.getElementById('modal-total-price').innerText = '$' + total.toLocaleString();
            document.getElementById('vip-modal').style.display = 'flex';
        }

        function closeVipModal() {
            document.getElementById('vip-modal').style.display = 'none';
        }

        function confirmOrder() {
            const currentUser = JSON.parse(localStorage.getItem('lambo_logged_in'));
            const totalText = document.getElementById('modal-total-price').innerText;
            const contractCode = document.getElementById('contract-code').innerText;

            const newOrder = {
                contractId: contractCode,
                date: new Date().toLocaleString('vi-VN'),
                items: currentCartData,
                total: totalText
            };

            // Lưu vào danh sách xe đã sở hữu của user
            const orderKey = `orders_${currentUser.username.toLowerCase()}`;
            let userOrders = JSON.parse(localStorage.getItem(orderKey) || '[]');
            userOrders.unshift(newOrder);
            localStorage.setItem(orderKey, JSON.stringify(userOrders));

            // Xóa sạch giỏ hàng lamboCart và cập nhật lại giao diện
            localStorage.removeItem('lamboCart');
            if (typeof cart !== 'undefined') {
                cart = [];
            }
            if (typeof updateCartCount === 'function') {
                updateCartCount();
            }
            if (typeof renderCart === 'function') {
                renderCart();
            }

            alert('Xác nhận hợp đồng thành công! Siêu xe đã chính thức được chuyển vào Bộ sưu tập Garage VIP.');
            closeVipModal();
            window.location.href = 'auth.html';
        }
    </script>
</body>
</html>
