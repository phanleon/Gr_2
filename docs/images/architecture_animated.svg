  <!-- Packet 1: Discovery Gist Sync Packet (Amber) -->
  <circle r="5" fill="#F59E0B" filter="url(#glow-amber)">
    <animateMotion dur="2.4s" repeatCount="indefinite" path="M 703 155 L 625 155" />
  </circle>
  <circle r="5" fill="#FBBF24" filter="url(#glow-amber)">
