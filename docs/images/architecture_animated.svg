  <!-- ================= ANIMATED FLOW CONNECTION PATHS ================= -->

  <!-- PATH 1: Discovery Sync (Server -> Cloudflare -> Gist -> Client) -->
  <path id="path-sync-1" d="M 703 155 L 625 155" fill="none" stroke="#F59E0B" stroke-width="2" stroke-dasharray="4,4" opacity="0.6"/>
  <path id="path-sync-2" d="M 485 182 L 485 196" fill="none" stroke="#F59E0B" stroke-width="2" stroke-dasharray="4,4" opacity="0.6"/>
  <path id="path-sync-3" d="M 345 225 C 310 225, 300 160, 267 160" fill="none" stroke="#F59E0B" stroke-width="2" stroke-dasharray="5,5" opacity="0.75"/>

