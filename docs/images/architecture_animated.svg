  <path id="path-win32-inject" d="M 703 185 C 550 210, 430 310, 267 310" fill="none" stroke="#EC4899" stroke-width="2" stroke-dasharray="4,4" opacity="0.75"/>

  <!-- PATH 5: Shell Commands to Firewall (PTY -> CmdFirewall) -->
  <path id="path-shell-cmd" d="M 267 455 C 460 455, 540 320, 703 320" fill="none" stroke="#A78BFA" stroke-width="2.5" stroke-dasharray="5,5" opacity="0.8"/>

