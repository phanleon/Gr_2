<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%" style="background:#0b0f19; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; border-radius:14px; box-shadow:0 8px 32px rgba(0,0,0,0.45);">
  <defs>
    <!-- Background Grid Pattern -->
    <pattern id="cyber-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1"/>
    </pattern>

    <!-- Glow Filters -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-red" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-amber" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <!-- Gradients -->
    <linearGradient id="header-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0984E3"/>
      <stop offset="50%" stop-color="#6C5CE7"/>
      <stop offset="100%" stop-color="#00CEC9"/>
    </linearGradient>

    <linearGradient id="client-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111c24"/>
      <stop offset="100%" stop-color="#0d151c"/>
    </linearGradient>

    <linearGradient id="tunnel-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#241d11"/>
      <stop offset="100%" stop-color="#18130a"/>
    </linearGradient>

    <linearGradient id="server-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#151a2e"/>
      <stop offset="100%" stop-color="#0d1121"/>
    </linearGradient>

    <!-- Marker Arrowheads -->
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#00CEC9"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10B981"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#F59E0B"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#EF4444"/>
    </marker>
    <marker id="arrow-magenta" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#EC4899"/>
    </marker>
  </defs>

  <style>
    @keyframes pulse {
      0% { opacity: 0.3; }
      50% { opacity: 1; }
      100% { opacity: 0.3; }
    }
    @keyframes alert-flash {
      0% { stroke: #EF4444; stroke-width: 2.5; filter: drop-shadow(0 0 8px #EF4444); }
      50% { stroke: #FF7675; stroke-width: 1.5; filter: none; }
      100% { stroke: #EF4444; stroke-width: 2.5; filter: drop-shadow(0 0 8px #EF4444); }
    }
    @keyframes flow-dash {
      from { stroke-dashoffset: 40; }
      to { stroke-dashoffset: 0; }
    }
    .tunnel-pipe {
      stroke-dasharray: 6, 6;
      animation: flow-dash 1.2s linear infinite;
    }
    .alert-box {
      animation: alert-flash 1.2s infinite ease-in-out;
    }
    .node-title { font-weight: 600; font-size: 13px; fill: #ffffff; }
    .node-sub { font-size: 11px; fill: #94a3b8; }
    .zone-title { font-weight: 700; font-size: 14px; letter-spacing: 0.5px; }
  </style>

  <!-- Base Grid Fill -->
  <rect width="1000" height="620" fill="url(#cyber-grid)" rx="14"/>

  <!-- ================= TOP TITLE BAR ================= -->
  <rect x="0" y="0" width="1000" height="48" fill="#070a12" rx="14"/>
  <rect x="0" y="46" width="1000" height="2" fill="url(#header-grad)"/>
  <circle cx="28" cy="24" r="5" fill="#EF4444"/>
  <circle cx="44" cy="24" r="5" fill="#F59E0B"/>
  <circle cx="60" cy="24" r="5" fill="#10B981"/>
  <text x="500" y="29" text-anchor="middle" font-size="14" font-weight="700" fill="#E2E8F0" letter-spacing="1">
    ⚡ SECURE REMOTE WORKSPACE — ZERO-TRUST OPERATIONAL ARCHITECTURE
  </text>
  <text x="965" y="28" text-anchor="end" font-size="11" font-weight="600" fill="#00CEC9">● LIVE DATA FLOW</text>

  <!-- ================= 1. CLIENT WORKSTATION ZONE ================= -->
  <g transform="translate(35, 68)">
    <rect width="250" height="525" rx="12" fill="url(#client-bg)" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.4" filter="url(#card-shadow)"/>
